<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quickdraw — Wireframes</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a1a; font-family: 'Caveat', cursive; }

  /* Wireframe base styles */
  .wf {
    font-family: 'Caveat', cursive;
    background: #f7f4ee;
    position: relative;
  }
  .wf * { font-family: 'Caveat', cursive; }
  .wf-border { border: 2px solid #333; }
  .wf-shadow { box-shadow: 3px 3px 0 #333; }
  .wf-bold { font-weight: 700; }
  .mono { font-family: 'Space Mono', monospace; font-size: 10px; }

  :root {
    --accent-yellow: #f5e642;
    --accent-lime: #8bf542;
    --accent-cyan: #42e8f5;
    --accent-red: #f54242;
    --ui-scale: 1;
    --annot-color: #cc2200;
  }

  /* Sketch fills */
  .fill-dark { background: #2a2a2a; color: #eee; }
  .fill-light { background: #f0ece0; }
  .fill-yellow { background: var(--accent-yellow); color: #111; }
  .fill-cyan { background: var(--accent-cyan); color: #111; }
  .fill-lime { background: var(--accent-lime); color: #111; }
  .fill-red { background: var(--accent-red); color: #fff; }
  .fill-amber { background: #f5c842; color: #111; }
  .fill-mid { background: #ddd; }
  .fill-stripe { background: repeating-linear-gradient(45deg, #e8e4d8, #e8e4d8 4px, #f0ece0 4px, #f0ece0 10px); }

  .label-muted { color: #888; font-size: 11px; }
  .label-tiny { color: #aaa; font-size: 9px; font-family: 'Space Mono', monospace; }

  /* Separator */
  .sep { border-top: 1.5px solid #bbb; margin: 0; }
  .sep-dark { border-top: 1.5px solid #444; }

  /* Annotation */
  .annot {
    position: absolute;
    font-size: 13px;
    color: #c00;
    font-family: 'Caveat', cursive;
    pointer-events: none;
    white-space: nowrap;
    line-height: 1.5;
  }
  .annot-line {
    position: absolute;
    border-top: 1px dashed #c00;
    pointer-events: none;
  }

  /* Countdown bar */
  .countdown { height: 3px; background: #ccc; position: relative; overflow: hidden; }
  .countdown-fill { height: 100%; width: 60%; }

  /* Score block */
  .score-block {
    width: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid #333;
    box-shadow: 3px 3px 0 #333;
    padding: 4px 2px;
    flex-shrink: 0;
  }
  .score-num { font-size: 22px; font-weight: 700; line-height: 1; font-family: 'Space Mono', monospace; }
  .score-label { font-size: 9px; font-weight: 700; letter-spacing: 0.05em; font-family: 'Space Mono', monospace; margin-top: 2px; }

  /* Pill tag */
  .pill {
    display: inline-block;
    padding: 1px 6px;
    font-size: 11px;
    font-weight: 700;
    border: 1.5px solid #333;
    font-family: 'Space Mono', monospace;
  }

  /* Action button */
  .act-btn {
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    border: 2px solid #333;
    cursor: pointer;
    font-family: 'Caveat', cursive;
    letter-spacing: 0.02em;
  }

  /* Toggle group */
  .toggle-group { display: flex; gap: 2px; }
  .toggle-btn {
    flex: 1;
    padding: 4px 6px;
    font-size: 12px;
    font-weight: 700;
    border: 1.5px solid #333;
    text-align: center;
    font-family: 'Caveat', cursive;
  }
  .toggle-btn.active { background: #f5e642; }
  .toggle-btn.inactive { background: #ddd; color: #777; border-color: #aaa; }

  /* Stat row */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 0;
    font-size: 13px;
  }
  .stat-val { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; }

  /* Left accent stripe */
  .accent-stripe {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
  }

  /* Section label */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #888;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
    margin-bottom: 5px;
  }

  /* Slide states */
  .state-tag {
    position: absolute;
    top: -18px;
    left: 0;
    font-size: 10px;
    color: #888;
    font-family: 'Caveat', cursive;
  }

  /* Variant label */
  .variant-label {
    font-family: 'Caveat', cursive;
    font-size: 15px;
    color: #555;
    margin-bottom: 8px;
    font-weight: 700;
  }

  /* Cursor ghost */
  .cursor-ghost {
    width: 12px; height: 12px;
    border-left: 2px solid #333;
    border-top: 2px solid #333;
    clip-path: polygon(0 0, 100% 0, 0 100%);
    background: #fff;
    border: none;
    display: inline-block;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* ── LOADING STATES ── */
const PopupLoading = () => (
  <div className="wf wf-border wf-shadow fill-dark" style={{ width: 260, position: 'relative', overflow: 'hidden' }}>
    <div className="accent-stripe" style={{ background: '#444' }} />
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '7px 10px 7px 14px', borderBottom: '1px solid #2e2e2e' }}>
      <span style={{ fontSize: 11, fontWeight: 700, color: '#f5e642', fontFamily: 'Space Mono' }}>⚡ QUICKDRAW</span>
      <div style={{ display: 'flex', gap: 8 }}>
        <span style={{ fontSize: 12, color: '#555' }}>⚙</span>
        <span style={{ fontSize: 12, color: '#555' }}>✕</span>
      </div>
    </div>
    <div style={{ display: 'flex', gap: 12, padding: '10px 12px 10px 14px', alignItems: 'center' }}>
      <div className="score-block" style={{ background: '#333' }}>
        <span className="score-num" style={{ color: '#666' }}>?</span>
        <span className="score-label" style={{ color: '#555' }}>…</span>
      </div>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 16, fontWeight: 700, color: '#555', fontFamily: 'Space Mono', lineHeight: 1 }}>BONK</div>
        <div style={{ fontSize: 12, color: '#444', marginTop: 4, fontFamily: 'Space Mono' }}>Fetching…</div>
      </div>
    </div>
    <div className="countdown" style={{ background: '#2a2a2a' }}>
      <div className="countdown-fill" style={{ background: '#555', width: '90%' }} />
    </div>
  </div>
);

/* ── SETTINGS PANEL VARIANTS ── */
const { useState, useEffect, useRef } = React;

/* ── Sketch helpers ── */
const Hatch = ({ w = 80, h = 40, label = '' }) => (
  <div style={{
    width: w, height: h,
    background: 'repeating-linear-gradient(45deg,#ddd,#ddd 3px,#f0ece0 3px,#f0ece0 9px)',
    border: '1.5px dashed #aaa',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    flexShrink: 0,
  }}>
    {label && <span style={{ fontSize: 9, color: '#888', fontFamily: 'Space Mono', textAlign: 'center', padding: 2 }}>{label}</span>}
  </div>
);

const Annot = ({ children, style = {} }) => (
  <div style={{ fontSize: 10, color: '#c44', fontFamily: 'Caveat', lineHeight: 1.3, ...style }}>
    {children}
  </div>
);

/* ── TOKEN POPUP VARIANTS ── */

// V1: Canonical — score block + ticker + price
const PopupV1 = ({ state = 'full', score = 82, scoreColor = '#8bf542', label = 'SAFE' }) => {
  const loading = state === 'loading';
  return (
    <div className="wf wf-border wf-shadow fill-dark" style={{ width: 260, position: 'relative', overflow: 'hidden' }}>
      <div className="accent-stripe" style={{ background: loading ? '#444' : scoreColor }} />
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '7px 10px 7px 14px', borderBottom: '1px solid #2e2e2e' }}>
        <span style={{ fontSize: 11, fontWeight: 700, color: '#f5e642', letterSpacing: '0.06em', fontFamily: 'Space Mono' }}>⚡ QUICKDRAW</span>
        <div style={{ display: 'flex', gap: 8 }}>
          <span style={{ fontSize: 12, color: '#888', cursor: 'pointer' }}>⚙</span>
          <span style={{ fontSize: 12, color: '#888', cursor: 'pointer' }}>✕</span>
        </div>
      </div>
      {/* Main row */}
      <div style={{ display: 'flex', gap: 12, padding: '10px 12px 10px 14px', alignItems: 'center' }}>
        <div className="score-block" style={{ background: loading ? '#444' : scoreColor }}>
          <span className="score-num" style={{ color: '#111' }}>{loading ? '?' : score}</span>
          <span className="score-label" style={{ color: '#111' }}>{loading ? '…' : label}</span>
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 16, fontWeight: 700, color: '#fff', fontFamily: 'Space Mono', lineHeight: 1 }}>
            {loading ? <span style={{ color: '#444' }}>…</span> : 'BONK'}
          </div>
          {loading ? (
            <div style={{ fontSize: 12, color: '#444', marginTop: 4 }}>Fetching…</div>
          ) : (
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 4 }}>
              <span style={{ fontSize: 13, color: '#ccc', fontFamily: 'Space Mono' }}>$0.000021</span>
              <span style={{ fontSize: 12, color: scoreColor, fontFamily: 'Space Mono', fontWeight: 700 }}>▲ 12.3%</span>
            </div>
          )}
        </div>
      </div>
      {/* Countdown bar */}
      <div className="countdown" style={{ background: '#2a2a2a' }}>
        <div className="countdown-fill" style={{ background: loading ? '#555' : scoreColor, width: loading ? '92%' : '55%' }} />
      </div>
    </div>
  );
};

// V2: Score right-aligned + ticker bold
const PopupV2 = () => (
  <div className="wf wf-border wf-shadow fill-dark" style={{ width: 260, position: 'relative' }}>
    <div className="accent-stripe" style={{ background: '#8bf542' }} />
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '7px 10px 7px 14px', borderBottom: '1px solid #2e2e2e' }}>
      <span style={{ fontSize: 11, fontWeight: 700, color: '#f5e642', fontFamily: 'Space Mono' }}>⚡ QUICKDRAW</span>
      <div style={{ display: 'flex', gap: 8 }}>
        <span style={{ fontSize: 12, color: '#888' }}>⚙</span>
        <span style={{ fontSize: 12, color: '#888' }}>✕</span>
      </div>
    </div>
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 12px 10px 14px' }}>
      <div>
        <div style={{ fontSize: 18, fontWeight: 700, color: '#fff', fontFamily: 'Space Mono', lineHeight: 1 }}>BONK</div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'baseline', marginTop: 4 }}>
          <span style={{ fontSize: 12, color: '#ccc', fontFamily: 'Space Mono' }}>$0.000021</span>
          <span style={{ fontSize: 11, color: '#8bf542', fontFamily: 'Space Mono', fontWeight: 700 }}>▲ 12.3%</span>
        </div>
      </div>
      <div style={{ textAlign: 'right' }}>
        <div style={{ fontSize: 26, fontWeight: 700, color: '#8bf542', fontFamily: 'Space Mono', lineHeight: 1 }}>82</div>
        <div style={{ fontSize: 9, color: '#8bf542', fontFamily: 'Space Mono', letterSpacing: '0.05em', marginTop: 2 }}>SAFE</div>
      </div>
    </div>
    <div className="countdown" style={{ background: '#2a2a2a' }}>
      <div className="countdown-fill" style={{ background: '#8bf542', width: '55%' }} />
    </div>
  </div>
);

// V3: Score banner header — primary design direction
const PopupV3 = ({ state = 'safe', score = 82, ticker = 'BONK', price = '$0.000021', change = '▲ 12.3%', showBuyToggle = false }) => {
  const [buyOpen, setBuyOpen] = React.useState(false);
  const loading = state === 'loading';
  const colors = { safe: '#8bf542', caution: '#f5c842', danger: '#f54242', loading: '#222' };
  const labels = { safe: 'SAFE', caution: 'CAUTION', danger: 'HIGH RISK', loading: '…' };
  const scoreColor = colors[state] || '#8bf542';
  const scoreLabel = labels[state] || 'SAFE';
  const textColor = state === 'danger' ? '#fff' : '#111';
  const changeColor = change.startsWith('▲') ? '#8bf542' : '#f54242';
  const btnColor = state === 'danger' ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.35)';
  return (
    <div className="wf wf-border wf-shadow fill-dark" style={{ width: 260, position: 'relative' }}>
      {/* Score-first header — full width color block */}
      <div style={{ background: loading ? '#1e1e1e' : scoreColor, padding: '10px 12px', display: 'flex', alignItems: 'center', gap: 10 }}>
        <span style={{ fontSize: 34, fontWeight: 700, color: loading ? '#333' : textColor, fontFamily: 'Space Mono', lineHeight: 1, minWidth: 44 }}>
          {loading ? '?' : score}
        </span>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 9, fontWeight: 700, color: loading ? '#444' : (state === 'danger' ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.45)'), fontFamily: 'Space Mono', letterSpacing: '0.08em' }}>{scoreLabel}</div>
          <div style={{ fontSize: 17, fontWeight: 700, color: loading ? '#333' : textColor, fontFamily: 'Space Mono', lineHeight: 1.15, marginTop: 1 }}>{loading ? '———' : ticker}</div>
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          <span style={{ fontSize: 13, color: btnColor, cursor: 'pointer' }}>⚙</span>
          <span style={{ fontSize: 13, color: btnColor, cursor: 'pointer' }}>✕</span>
        </div>
      </div>
      {/* Price row */}
      <div style={{ padding: '8px 12px 6px', display: 'flex', alignItems: 'center', gap: 10 }}>
        {loading ? (
          <span style={{ fontSize: 12, color: '#fff', fontFamily: 'Space Mono' }}>Fetching…</span>
        ) : (
          <>
            <span style={{ fontSize: 13, color: '#fff', fontFamily: 'Space Mono', fontWeight: 700 }}>{price}</span>
            <span style={{ fontSize: 12, color: state === 'danger' ? '#f54242' : changeColor, fontFamily: 'Space Mono', fontWeight: 700 }}>{change}</span>
          </>
        )}
      </div>
      {/* Action buttons row */}
      {showBuyToggle && !loading && !buyOpen && (
        <div style={{ display: 'flex', gap: 0, borderTop: '1px solid #1e1e1e' }}>
          <button
            onClick={() => setBuyOpen(true)}
            style={{
              flex: 1, padding: '8px 0', fontSize: 11, fontWeight: 700,
              fontFamily: 'Space Mono', cursor: 'pointer', letterSpacing: '0.06em',
              background: scoreColor, color: textColor,
              border: 'none', borderRight: '1px solid #111',
            }}
          >BUY</button>
          <button
            style={{
              flex: 1, padding: '8px 0', fontSize: 11, fontWeight: 700,
              fontFamily: 'Space Mono', cursor: 'pointer', letterSpacing: '0.06em',
              background: '#1a1a1a', color: '#fff',
              border: 'none',
            }}
          >CANCEL</button>
        </div>
      )}
      {/* Swap panel expands when BUY clicked */}
      {showBuyToggle && buyOpen && (
        <>
          <div style={{ borderTop: '1px solid #1e1e1e' }}>
            <SwapPanel state="ready" amount="0.5" compact />
          </div>
          <button
            onClick={() => setBuyOpen(false)}
            style={{
              width: '100%', padding: '7px 0', fontSize: 10, fontWeight: 700,
              fontFamily: 'Space Mono', cursor: 'pointer', letterSpacing: '0.06em',
              background: '#1a1a1a', color: '#fff',
              border: 'none', borderTop: '1px solid #1e1e1e',
            }}
          >✕ CANCEL</button>
        </>
      )}
    </div>
  );
};

// V4: DANGER state
const PopupV4 = () => (
  <div className="wf wf-border wf-shadow fill-dark" style={{ width: 260, position: 'relative', overflow: 'hidden' }}>
    <div className="accent-stripe" style={{ background: '#f54242' }} />
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '7px 10px 7px 14px', borderBottom: '1px solid #2e2e2e' }}>
      <span style={{ fontSize: 11, fontWeight: 700, color: '#f5e642', fontFamily: 'Space Mono' }}>⚡ QUICKDRAW</span>
      <div style={{ display: 'flex', gap: 8 }}>
        <span style={{ fontSize: 12, color: '#888' }}>⚙</span>
        <span style={{ fontSize: 12, color: '#888' }}>✕</span>
      </div>
    </div>
    <div style={{ display: 'flex', gap: 12, padding: '10px 12px 10px 14px', alignItems: 'center' }}>
      <div className="score-block" style={{ background: '#f54242' }}>
        <span className="score-num" style={{ color: '#fff' }}>21</span>
        <span className="score-label" style={{ color: '#fff', fontSize: 7 }}>HIGH RISK</span>
      </div>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 16, fontWeight: 700, color: '#fff', fontFamily: 'Space Mono', lineHeight: 1 }}>SCAM</div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 4 }}>
          <span style={{ fontSize: 12, color: '#aaa', fontFamily: 'Space Mono' }}>$0.000001</span>
          <span style={{ fontSize: 11, color: '#f54242', fontFamily: 'Space Mono', fontWeight: 700 }}>▼ 91.2%</span>
        </div>
      </div>
    </div>
    <div className="countdown" style={{ background: '#2a2a2a' }}>
      <div className="countdown-fill" style={{ background: '#f54242', width: '30%' }} />
    </div>
  </div>
);

// V5: Pill — super minimal, single line
const PopupV5 = () => (
  <div className="wf wf-border wf-shadow fill-dark" style={{ width: 220, position: 'relative', overflow: 'hidden' }}>
    <div className="accent-stripe" style={{ background: '#f5c842' }} />
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px 8px 14px' }}>
      <div style={{ background: '#f5c842', padding: '3px 8px', border: '1.5px solid #333', boxShadow: '2px 2px 0 #333' }}>
        <span style={{ fontSize: 14, fontWeight: 700, fontFamily: 'Space Mono', color: '#111' }}>63</span>
      </div>
      <span style={{ fontSize: 16, fontWeight: 700, color: '#fff', fontFamily: 'Space Mono', flex: 1 }}>BONK</span>
      <span style={{ fontSize: 12, color: '#f5c842', fontFamily: 'Space Mono', fontWeight: 700 }}>▲12.3%</span>
      <span style={{ fontSize: 12, color: '#555' }}>✕</span>
    </div>
    <div className="countdown" style={{ background: '#2a2a2a' }}>
      <div className="countdown-fill" style={{ background: '#f5c842', width: '70%' }} />
    </div>
  </div>
);

/* ── SETTINGS PANEL VARIANTS ── */

const SLabel = ({ children, light }) => (
  <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.08em', color: light ? '#888' : '#666', textTransform: 'uppercase', fontFamily: 'Space Mono', marginBottom: 5 }}>{children}</div>
);
const SRow = ({ label, value, light }) => (
  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '4px 0', borderBottom: `1px solid ${light ? '#2a2a2a' : '#e0e0e0'}` }}>
    <span style={{ fontSize: 10, fontFamily: 'Space Mono', color: light ? '#666' : '#999', letterSpacing: '0.04em' }}>{label}</span>
    <span style={{ fontFamily: 'Space Mono', fontSize: 11, fontWeight: 700, color: light ? '#fff' : '#111' }}>{value}</span>
  </div>
);

// Shared Skills tab content
const SkillsTab = ({ light }) => (
  <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
    {[
      { name: 'Jupiter Swap', tag: 'DEX', active: true },
      { name: 'Drift Protocol', tag: 'PERPS', active: false },
      { name: 'MarginFi Lend', tag: 'LENDING', active: false },
      { name: 'Kamino Earn', tag: 'YIELD', active: false },
    ].map(s => (
      <div key={s.name} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '7px 0', borderBottom: `1px solid ${light ? '#2e2e2e' : '#e8e4dc'}` }}>
        <div>
          <span style={{ fontSize: 12, fontWeight: 700, color: light ? '#fff' : '#111', fontFamily: 'Space Mono' }}>{s.name}</span>
          <span style={{ fontSize: 9, color: light ? '#f5e642' : '#555', fontFamily: 'Space Mono', fontWeight: 700, marginLeft: 6, background: light ? '#222' : '#e0e0d0', padding: '1px 4px', border: `1px solid ${light ? '#444' : '#aaa'}` }}>{s.tag}</span>
        </div>
        <div style={{ width: 28, height: 14, background: s.active ? '#8bf542' : (light ? '#333' : '#ccc'), border: `1.5px solid ${light ? '#555' : '#aaa'}`, position: 'relative', cursor: 'pointer', flexShrink: 0 }}>
          <div style={{ position: 'absolute', top: 1, left: s.active ? 13 : 1, width: 9, height: 9, background: s.active ? '#111' : (light ? '#666' : '#888') }} />
        </div>
      </div>
    ))}
    <button style={{ width: '100%', padding: '6px', marginTop: 8, fontSize: 10, fontWeight: 700, fontFamily: 'Space Mono', background: 'none', border: `1.5px dashed ${light ? '#444' : '#bbb'}`, color: light ? '#555' : '#999', cursor: 'pointer', letterSpacing: '0.04em' }}>+ Browse plugins</button>
  </div>
);

// Shared State tab content
const StateTab = ({ light, paused, walletConnected }) => (
  <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12, borderBottom: '1.5px solid #ccc', paddingBottom: 8 }}>
        <span style={{ fontSize: 15, fontWeight: 700, color: '#111', letterSpacing: '0.04em' }}>Tweaks</span>
        <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: 16, cursor: 'pointer', color: '#555' }}>✕</button>
      </div>

      <div style={{ fontSize: 10, fontWeight: 700, color: '#888', letterSpacing: '0.08em', fontFamily: 'Space Mono', marginBottom: 6 }}>SCALE</div>
      <div style={rowStyle}>
        <span style={labelStyle}>UI Scale</span>
        <div style={{ display: 'flex', gap: 4 }}>
          {[0.75, 1, 1.25, 1.5].map(s => (
            <button key={s} onClick={() => set('uiScale', s)} style={{ ...inputStyle, background: tweaks.uiScale === s ? '#f5e642' : '#fff', fontWeight: 700, cursor: 'pointer', minWidth: 32, textAlign: 'center' }}>{s}×</button>
          ))}
        </div>
      </div>

      <div style={{ fontSize: 10, fontWeight: 700, color: '#888', letterSpacing: '0.08em', fontFamily: 'Space Mono', marginBottom: 6 }}>CANVAS</div>
      <div style={rowStyle}>
        <span style={labelStyle}>Background</span>
        <div style={{ display: 'flex', gap: 4 }}>
          {['#1a1a1a','#f5f0e8','#ffffff'].map(bg => (
            <button key={bg} onClick={() => set('canvasBg', bg)} title={bg} style={{ width: 22, height: 22, background: bg, border: tweaks.canvasBg === bg ? '2px solid #f5e642' : '1.5px solid #666', cursor: 'pointer', boxShadow: tweaks.canvasBg === bg ? '2px 2px 0 #333' : 'none' }} />
          ))}
        </div>
      </div>
      <div style={rowStyle}>
        <span style={labelStyle}>Annotations</span>
        <button onClick={() => set('showAnnotations', !tweaks.showAnnotations)} style={{ ...inputStyle, background: tweaks.showAnnotations ? '#8bf542' : '#ddd', cursor: 'pointer', fontWeight: 700, padding: '2px 10px' }}>
          {tweaks.showAnnotations ? 'ON' : 'OFF'}
        </button>
      </div>

      <div style={{ fontSize: 10, fontWeight: 700, color: '#888', letterSpacing: '0.08em', fontFamily: 'Space Mono', marginBottom: 6 }}>PALETTE</div>
      {[['accentYellow','Yellow'],['accentLime','Lime'],['accentCyan','Cyan'],['accentRed','Red']].map(([key, lbl]) => (
        <div key={key} style={{ ...rowStyle, marginBottom: 7 }}>
          <span style={labelStyle}>{lbl}</span>
          <input type="color" value={tweaks[key]} onChange={e => set(key, e.target.value)}
            style={{ width: 36, height: 24, border: '1.5px solid #333', cursor: 'pointer', padding: 1 }} />
        </div>
      ))}
    </div>
  );
}

function applyTweaks(t) {
  document.body.style.background = t.canvasBg;
  const root = document.documentElement;
  root.style.setProperty('--accent-yellow', t.accentYellow);
  root.style.setProperty('--accent-lime', t.accentLime);
  root.style.setProperty('--accent-cyan', t.accentCyan);
  root.style.setProperty('--accent-red', t.accentRed);
  root.style.setProperty('--ui-scale', t.uiScale);
  root.style.setProperty('--annot-color', t.annotColor);
  // annotations visibility
  const style = document.getElementById('tweak-annot-style') || Object.assign(document.createElement('style'), { id: 'tweak-annot-style' });
  if (!style.parentNode) document.head.appendChild(style);
  style.textContent = t.showAnnotations ? '' : '.annot, [data-annot] { opacity: 0 !important; }';
}

function AppWithTweaks() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem('qd-tweaks') || '{}'); } catch(e) { return {}; } })();
  const [tweaks, setTweaksRaw] = useState({ ...TWEAK_DEFAULTS, ...saved });
  const [tweaksVisible, setTweaksVisible] = useState(false);

  const setTweaks = (t) => {
    setTweaksRaw(t);
    localStorage.setItem('qd-tweaks', JSON.stringify(t));
  };

  useEffect(() => {
    applyTweaks(tweaks);
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  useEffect(() => { applyTweaks(tweaks); }, [tweaks]);

  return <App tweaks={tweaks} setTweaks={setTweaks} tweaksVisible={tweaksVisible} setTweaksVisible={setTweaksVisible} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppWithTweaks />);

</script>
</body>
</html>
