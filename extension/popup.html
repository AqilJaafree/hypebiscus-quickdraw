<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 220px;
      background: #181818;
      font-family: monospace;
      color: #F5F0E8;
      padding: 14px;
    }
    .logo {
      color: #F5E642;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .status {
      color: #888;
      font-size: 11px;
      line-height: 1.5;
    }
    .status b { color: #8BF542; }
    .tip {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #333;
      color: #555;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="logo">⚡ QUICKDRAW</div>
  <div class="status">
    <b>Active</b> — watching for token addresses.<br><br>
    Highlight any Solana address on any page to see the organic score.
  </div>
  <div class="tip">
    Works on Twitter/X, Telegram Web, DexScreener, pump.fun, and anywhere else.
  </div>
</body>
</html>
