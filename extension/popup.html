<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quickdraw</title>
  <style>
    @font-face { font-family: 'QD Space Mono'; src: url(fonts/SpaceMono-Regular.ttf); font-weight: 400; }
    @font-face { font-family: 'QD Space Mono'; src: url(fonts/SpaceMono-Bold.ttf); font-weight: 700; }

    :root {
      --bg: #181818; --bg-deep: #111111; --raised: #232325;
      --hairline: rgba(255,255,255,0.08); --hairline-strong: rgba(255,255,255,0.16);
      --text: #ededed; --text-sec: #a1a1a6; --text-mut: #85858b;
      --brand: #f5e642; --safe: #4cc38a; --danger: #e5484d;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 280px; background: var(--bg); color: var(--text);
      font-family: 'QD Space Mono', 'Space Mono', ui-monospace, monospace;
      font-size: 12px; line-height: 16px; overflow: hidden;
      font-variant-numeric: tabular-nums; }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    svg { display: block; }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    .s-header { display: flex; justify-content: space-between; align-items: center;
      height: 48px; padding: 0 16px; background: var(--bg-deep); }
    .s-title { color: var(--brand); font-size: 14px; font-weight: 700; letter-spacing: 0.12em; }
    .icon-btn { display: grid; place-items: center; width: 28px; height: 28px; margin-right: -6px;
      background: none; border: none; color: var(--text-mut); cursor: pointer;
      transition: color 150ms var(--ease); }
    .icon-btn:hover { color: var(--text); }

    /* ── Tabs ───────────────────────────────────────────────────────────────── */
    .qd-tabs { display: flex; padding: 0 16px; gap: 16px; background: var(--bg-deep);
      border-bottom: 1px solid var(--hairline); }
    .qd-tab { height: 36px; padding: 0; border: none; background: none; cursor: pointer;
      color: var(--text-mut); border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color 150ms var(--ease), border-color 150ms var(--ease); }
    .qd-tab:hover { color: var(--text-sec); }
    .qd-tab.active { color: var(--text); border-bottom-color: var(--brand); }

    /* ── Panes ──────────────────────────────────────────────────────────────── */
    .qd-pane { display: none; }
    .qd-pane.active { display: block; }
    .content { padding: 16px; display: flex; flex-direction: column; gap: 24px; }

    /* ── Status row ─────────────────────────────────────────────────────────── */
    .status-row { display: flex; justify-content: space-between; align-items: center; }
    .status-left { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background: var(--safe); flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(76,195,138,0.16); }
    .status-dot.paused { background: var(--text-mut); box-shadow: none; }
    #status-text { font-size: 13px; }
    .btn-secondary { height: 28px; padding: 0 12px; background: var(--raised); color: var(--text);
      border: 1px solid var(--hairline); cursor: pointer;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease); }
    .btn-secondary:hover { border-color: var(--hairline-strong); }

    /* ── Section ────────────────────────────────────────────────────────────── */
    .section { display: flex; flex-direction: column; gap: 8px; }
    .section-label { color: var(--text-mut); }
    .rows { display: flex; flex-direction: column; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; height: 28px;
      border-bottom: 1px solid var(--hairline); }
    .stat-row:last-child { border-bottom: none; }
    .stat-key { color: var(--text-sec); }
    .stat-val { color: var(--text); }

    /* ── Wallet ─────────────────────────────────────────────────────────────── */
    .btn-primary { width: 100%; height: 40px; background: var(--brand); color: #111;
      font-weight: 700; font-size: 13px; cursor: pointer;
      border: 2px solid #000; box-shadow: 3px 3px 0 #333;
      transition: transform 120ms var(--ease), box-shadow 120ms var(--ease); }
    .btn-primary:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #333; }
    .wallet-row { display: flex; align-items: center; justify-content: space-between; gap: 8px;
      height: 40px; padding: 0 12px; background: var(--raised); border: 1px solid var(--hairline); }
    .wallet-row[hidden] { display: none; }
    .wallet-id { display: flex; flex-direction: column; min-width: 0; }
    #wallet-addr { color: var(--text); }
    #wallet-kind { color: var(--text-mut); font-size: 11px; line-height: 14px; }
    .link-btn { background: none; border: none; padding: 4px 0; cursor: pointer; color: var(--text-mut);
      transition: color 150ms var(--ease); }
    .link-btn:hover { color: var(--danger); }

    /* ── Portfolio ──────────────────────────────────────────────────────────── */
    .portfolio-total { display: flex; align-items: baseline; justify-content: space-between; }
    #portfolio-total-val { font-size: 28px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em; }
    .portfolio-row { display: flex; justify-content: space-between; align-items: center; height: 24px; }
    .portfolio-sym { color: var(--text-sec); }
    .portfolio-val { color: var(--text); }
    .portfolio-empty { color: var(--text-mut); }

    /* ── Skills list ────────────────────────────────────────────────────────── */
    .skills { display: flex; flex-direction: column; }
    .skill-row { display: flex; justify-content: space-between; align-items: center; height: 40px;
      border-bottom: 1px solid var(--hairline); }
    .skill-left { display: flex; align-items: baseline; gap: 8px; }
    .skill-name { font-size: 13px; color: var(--text); }
    .skill-tag { font-size: 11px; color: var(--text-mut); }
    .skill-row.disabled .skill-name { color: var(--text-mut); }
    .skill-soon { font-size: 11px; color: var(--text-mut); }

    .qd-switch { position: relative; width: 32px; height: 16px; flex-shrink: 0; padding: 0;
      border: 1px solid var(--hairline-strong); background: var(--raised); cursor: pointer;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease); }
    .qd-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px;
      background: var(--text-mut); transition: transform 150ms var(--ease), background-color 150ms var(--ease); }
    .qd-switch.on { background: var(--safe); border-color: var(--safe); }
    .qd-switch.on::after { transform: translateX(16px); background: #111; }

    .browse-btn { height: 40px; margin-top: 16px; background: none; border: 1px dashed var(--hairline-strong);
      color: var(--text-mut); cursor: not-allowed; }

    /* ── Footer ─────────────────────────────────────────────────────────────── */
    .footer { display: flex; justify-content: space-between; padding: 8px 16px;
      border-top: 1px solid var(--hairline); color: var(--text-mut); font-size: 11px; }
  </style>
</head>
<body>
  <div class="s-header">
    <span class="s-title">QUICKDRAW</span>
    <button class="icon-btn" id="close-btn" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <div class="qd-tabs" role="tablist">
    <button class="qd-tab active" id="tab-state" role="tab">State</button>
    <button class="qd-tab" id="tab-skills" role="tab">Skills</button>
  </div>

  <!-- State pane -->
  <div class="qd-pane active" id="pane-state">
    <div class="content">

      <div class="status-row">
        <div class="status-left">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">Watching pages</span>
        </div>
        <button class="btn-secondary" id="pause-btn">Pause</button>
      </div>

      <div class="section">
        <div class="section-label">Session</div>
        <div class="rows">
          <div class="stat-row">
            <span class="stat-key">Last token</span>
            <span class="stat-val" id="last-seen">—</span>
          </div>
          <div class="stat-row">
            <span class="stat-key">Running for</span>
            <span class="stat-val" id="session-time">—</span>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Wallet</div>
        <button id="connect-btn" class="btn-primary">Connect wallet</button>
        <div class="wallet-row" id="wallet-row" hidden>
          <div class="wallet-id">
            <span id="wallet-addr"></span>
            <span id="wallet-kind"></span>
          </div>
          <button class="link-btn" id="disconnect-btn">Disconnect</button>
        </div>
      </div>

      <div class="section" id="portfolio-section" style="display:none;">
        <div class="portfolio-total">
          <span class="section-label">Portfolio</span>
          <span id="portfolio-total-val"></span>
        </div>
        <div class="rows" id="portfolio-list"></div>
      </div>

    </div>
  </div>

  <!-- Skills pane -->
  <div class="qd-pane" id="pane-skills">
    <div class="content">
      <div class="skills">
        <div class="skill-row">
          <div class="skill-left">
            <span class="skill-name">Jupiter Swap</span>
            <span class="skill-tag">DEX</span>
          </div>
          <button class="qd-switch on" id="toggle-jupiter" role="switch" aria-label="Toggle Jupiter Swap"></button>
        </div>

        <div class="skill-row disabled">
          <div class="skill-left">
            <span class="skill-name">Drift Protocol</span>
            <span class="skill-tag">Perps</span>
          </div>
          <span class="skill-soon">Soon</span>
        </div>

        <div class="skill-row disabled">
          <div class="skill-left">
            <span class="skill-name">MarginFi Lend</span>
            <span class="skill-tag">Lending</span>
          </div>
          <span class="skill-soon">Soon</span>
        </div>

        <div class="skill-row disabled">
          <div class="skill-left">
            <span class="skill-name">Kamino Earn</span>
            <span class="skill-tag">Yield</span>
          </div>
          <span class="skill-soon">Soon</span>
        </div>

        <button class="browse-btn" disabled>Browse plugins</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <span>v0.1.1</span>
  </div>

  <script type="module" src="dist/popup.js"></script>
</body>
</html>
