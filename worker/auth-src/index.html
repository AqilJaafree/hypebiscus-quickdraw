<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quickdraw — Connect Wallet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111; color: #f5f0e8; font-family: monospace;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1a1a; border: 2px solid #000;
      box-shadow: 4px 4px 0 #000; padding: 32px; width: 360px;
      text-align: center;
    }
    h1 { color: #f5e642; font-size: 15px; letter-spacing: 2px; margin-bottom: 8px; }
    p  { color: #555; font-size: 11px; margin-bottom: 24px; line-height: 1.6; }
    #status { font-size: 12px; margin-top: 16px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>QUICKDRAW</h1>
    <p>Sign in with email, Google, or Apple.<br>Your Solana wallet is created automatically.</p>
    <appkit-button />
    <div id="status"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
