name = "quickdraw-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Set these via `wrangler secret put` — never commit real values
# ANTHROPIC_API_KEY = ""
# APP_SECRET = ""        # shared with the Rust binary for HMAC verification
# HELIUS_API_KEY = ""
# ASSEMBLYAI_API_KEY = ""
# OPENROUTER_API_KEY = ""  # Jev Router context signals (/ai/signals); optional — route returns 503 without it

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "431e107bbb604d89a778c8009e559dac"
# preview_id intentionally omitted: it used to equal the production id, so
# `wrangler dev --remote` shared production data.

# Per-IP request limit (Workers Rate Limiting). Replaces the KV counter, which
# wrote on every request. period must be 10 or 60 seconds.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
